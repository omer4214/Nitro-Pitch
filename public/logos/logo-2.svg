<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
    <linearGradient id="goldWing" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="cyanWing" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
  </defs>
  <rect width="256" height="256" rx="44" fill="url(#bg2)"/>
  <!-- Cybernetic Golden & Cyan Wings -->
  <polygon points="14,76 86,96 72,124 22,110" fill="url(#goldWing)"/>
  <polygon points="24,118 82,130 70,154 32,144" fill="url(#cyanWing)"/>
  <polygon points="242,76 170,96 184,124 234,110" fill="url(#goldWing)"/>
  <polygon points="232,118 174,130 186,154 224,144" fill="url(#cyanWing)"/>
  <!-- Central Octagonal Tournament Core -->
  <polygon points="96,36 160,36 204,80 204,144 160,188 96,188 52,144 52,80" fill="#0b1324" stroke="url(#goldWing)" stroke-width="5"/>
  <polygon points="102,48 154,48 192,86 192,138 154,176 102,176 64,138 64,86" fill="#070d19" stroke="#38bdf8" stroke-width="2"/>
  <!-- Glowing Energy Ball Center -->
  <circle cx="128" cy="96" r="30" fill="#0f172a" stroke="#f59e0b" stroke-width="3.5"/>
  <polygon points="128,74 143,85 137,103 119,103 113,85" fill="#f59e0b"/>
  <circle cx="128" cy="96" r="22" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="6 4"/>
  <!-- Twin-Turbo Supercar Front Silhouette -->
  <path d="M84 148 L102 126 L154 126 L172 148 L164 164 L92 164 Z" fill="url(#cyanWing)" stroke="#f8fafc" stroke-width="2"/>
  <rect x="92" y="146" width="20" height="7" rx="3" fill="#fef08a"/>
  <rect x="144" y="146" width="20" height="7" rx="3" fill="#fef08a"/>
  <!-- Championship Title Plate -->
  <path d="M36 196 L220 196 L208 232 L48 232 Z" fill="url(#goldWing)" stroke="#f8fafc" stroke-width="2"/>
  <text x="128" y="220" text-anchor="middle" fill="#090d16" font-family="Arial Black, sans-serif" font-weight="900" font-size="17" letter-spacing="2.5">NITRO PITCH</text>
</svg>

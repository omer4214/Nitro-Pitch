name: Build Windows EXE & Android APK for GitHub Releases

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-and-publish-release:
    name: Build PE32+ EXE & Signed Android APK and Publish Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies & Build Release Packages
        run: |
          npm install
          npm run build:releases

      - name: Upload Release Folder Artifact
        uses: actions/upload-artifact@v4
        with:
          name: oyun-indirme-paketi
          path: |
            oyun-indirme-paketi/NitroPitch-Windows-x64.exe
            oyun-indirme-paketi/NitroPitch-Android-Mobile.apk
            oyun-indirme-paketi/NitroPitch-Full-Release-Bundle.zip
            oyun-indirme-paketi/BENI-OKU-GITHUB-RELEASES.md

      - name: Publish or Update v1.0.0 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: Nitro Pitch 3D v1.0.0 (Windows .EXE + Android .APK)
          files: |
            oyun-indirme-paketi/NitroPitch-Windows-x64.exe
            oyun-indirme-paketi/NitroPitch-Android-Mobile.apk
            oyun-indirme-paketi/NitroPitch-Full-Release-Bundle.zip
            oyun-indirme-paketi/BENI-OKU-GITHUB-RELEASES.md
          generate_release_notes: true
